<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>only reading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // 配置 Tailwind CSS 启用 dark mode 和自定义主题颜色
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--bg-background)',
              surface: 'var(--bg-surface)',
              surface2: 'var(--bg-surface-2)',
              foreground: 'var(--text-foreground)',
              muted: 'var(--text-muted)',
              border: 'var(--border-color)',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap');

      /* 主题颜色变量 */
      :root {
        /* Light Theme (Default) */
        --bg-background: #ffffff;
        --bg-surface: #ffffff;
        --bg-surface-2: #f8fafc; /* slate-50 */
        --text-foreground: #0f172a; /* slate-900 */
        --text-muted: #64748b; /* slate-500 */
        --border-color: #e2e8f0; /* slate-200 */
        
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }

      /* Dark Theme */
      .dark, .theme-dark {
        --bg-background: #020617; /* slate-950 */
        --bg-surface: #0f172a; /* slate-900 */
        --bg-surface-2: #1e293b; /* slate-800 */
        --text-foreground: #f8fafc; /* slate-50 */
        --text-muted: #94a3b8; /* slate-400 */
        --border-color: #1e293b; /* slate-800 */
      }

      /* Solarized Light Theme */
      .theme-solarized-light {
        --bg-background: #fdf6e3; /* base3 */
        --bg-surface: #eee8d5; /* base2 */
        --bg-surface-2: #e6e0cc; /* Slightly darker than base2 */
        --text-foreground: #657b83; /* base00 */
        --text-muted: #93a1a1; /* base1 */
        --border-color: #d3d0c8; /* Custom border for solarized */
      }

      /* Solarized Dark Theme */
      .theme-solarized-dark {
        --bg-background: #002b36; /* base03 */
        --bg-surface: #073642; /* base02 */
        --bg-surface-2: #094654; /* Slightly lighter than base02 */
        --text-foreground: #839496; /* base0 */
        --text-muted: #586e75; /* base01 */
        --border-color: #0f3a4e; /* Custom border */
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-background);
        color: var(--text-foreground);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .font-serif {
        font-family: 'Noto Serif', serif;
      }

      /* Hide scrollbar for cleaner look in sidebar */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Custom Animations */
      .animate-in {
        animation-duration: 0.3s;
        animation-timing-function: ease-out;
        animation-fill-mode: both;
      }

      .fade-in {
        animation-name: fadeIn;
      }

      .slide-in-from-bottom-2 {
        animation-name: slideInFromBottom2;
      }
      
      .slide-in-from-top-1 {
        animation-name: slideInFromTop1;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideInFromBottom2 {
        from { transform: translateY(0.5rem); }
        to { transform: translateY(0); }
      }

      @keyframes slideInFromTop1 {
        from { transform: translateY(-0.25rem); }
        to { transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
  }
}
</script>
</head>
  <body class="h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
