<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>only reading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // 配置 Tailwind CSS 启用 dark mode 和自定义主题颜色
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--bg-background)',
              surface: 'var(--bg-surface)',
              surface2: 'var(--bg-surface-2)',
              foreground: 'var(--text-foreground)',
              muted: 'var(--text-muted)',
              border: 'var(--border-color)',
              primary: {
                50: 'rgb(var(--color-primary-50) / <alpha-value>)',
                100: 'rgb(var(--color-primary-100) / <alpha-value>)',
                200: 'rgb(var(--color-primary-200) / <alpha-value>)',
                300: 'rgb(var(--color-primary-300) / <alpha-value>)',
                400: 'rgb(var(--color-primary-400) / <alpha-value>)',
                500: 'rgb(var(--color-primary-500) / <alpha-value>)',
                600: 'rgb(var(--color-primary-600) / <alpha-value>)',
                700: 'rgb(var(--color-primary-700) / <alpha-value>)',
                800: 'rgb(var(--color-primary-800) / <alpha-value>)',
                900: 'rgb(var(--color-primary-900) / <alpha-value>)',
                950: 'rgb(var(--color-primary-950) / <alpha-value>)',
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap');

      /* 主题颜色变量 */
      :root {
        /* Default Primary Color (Cyan) */
        --color-primary-50: 236 254 255;
        --color-primary-100: 207 250 254;
        --color-primary-200: 165 243 252;
        --color-primary-300: 103 232 249;
        --color-primary-400: 34 211 238;
        --color-primary-500: 6 182 212;
        --color-primary-600: 8 145 178;
        --color-primary-700: 14 116 144;
        --color-primary-800: 21 94 117;
        --color-primary-900: 22 78 99;
        --color-primary-950: 8 51 68;

        /* Light Theme (Default) */
        --bg-background: #ffffff;
        --bg-surface: #ffffff;
        --bg-surface-2: #f8fafc; /* slate-50 */
        --text-foreground: #0f172a; /* slate-900 */
        --text-muted: #64748b; /* slate-500 */
        --border-color: #e2e8f0; /* slate-200 */
        
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }

      /* Dark Theme - Redesigned (Soft Zinc) */
      .dark, .theme-dark {
        --bg-background: #18181b; /* zinc-950 */
        --bg-surface: #27272a; /* zinc-800 */
        --bg-surface-2: #3f3f46; /* zinc-700 */
        --text-foreground: #e4e4e7; /* zinc-200 */
        --text-muted: #a1a1aa; /* zinc-400 */
        --border-color: #27272a; /* zinc-800 */
      }

      /* Solarized Light Theme */
      .theme-solarized-light {
        --bg-background: #fdf6e3; /* base3 */
        --bg-surface: #eee8d5; /* base2 */
        --bg-surface-2: #e6e0cc; /* Slightly darker than base2 */
        --text-foreground: #657b83; /* base00 */
        --text-muted: #93a1a1; /* base1 */
        --border-color: #d3d0c8; /* Custom border for solarized */
      }

      /* Solarized Dark Theme - Redesigned (Warm Stone) */
      .theme-solarized-dark {
        --bg-background: #1c1917; /* stone-950 */
        --bg-surface: #292524; /* stone-800 */
        --bg-surface-2: #44403c; /* stone-700 */
        --text-foreground: #e7e5e4; /* stone-200 */
        --text-muted: #a8a29e; /* stone-400 */
        --border-color: #292524; /* stone-800 */
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-background);
        color: var(--text-foreground);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .font-serif {
        font-family: 'Noto Serif', serif;
      }

      /* Hide scrollbar for cleaner look in sidebar */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Custom Animations */
      .animate-in {
        animation-duration: 0.3s;
        animation-timing-function: ease-out;
        animation-fill-mode: both;
      }

      .fade-in {
        animation-name: fadeIn;
      }

      .slide-in-from-bottom-2 {
        animation-name: slideInFromBottom2;
      }
      
      .slide-in-from-top-1 {
        animation-name: slideInFromTop1;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideInFromBottom2 {
        from { transform: translateY(0.5rem); }
        to { transform: translateY(0); }
      }

      @keyframes slideInFromTop1 {
        from { transform: translateY(-0.25rem); }
        to { transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "jszip": "https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm"
  }
}
</script>
</head>
  <body class="h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
